<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Remote</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* ── ORB BACKGROUND ── */
    #orb-bg {
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%; border: none;
      pointer-events: none; opacity: 0.55;
    }
    .app-shell, footer, .sidebar, .main-panel { position: relative; z-index: 1; }
    /* ── FEED ── */
    #feed {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 10px; padding: 18px 24px; min-height: 0;
    }
    #feed::-webkit-scrollbar { width: 6px; }
    #feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }
    .msg {
      max-width: 78%; padding: 14px 18px; border-radius: 20px;
      font-size: 14px; line-height: 1.55; word-break: break-word;
      animation: msgIn 0.22s ease;
    }
    @keyframes msgIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .msg .lbl {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 6px;
      color: rgba(255,255,255,0.5);
    }
    .msg-u {
      align-self: flex-end;
      background: rgba(255, 170, 48, 0.13);
      border: 1px solid rgba(255, 170, 48, 0.28);
      color: var(--text);
    }
    .msg-u .lbl { color: var(--accent); }
    .msg-j {
      align-self: flex-start;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--text);
    }
    .msg-sys {
      align-self: center; text-align: center;
      background: transparent; color: rgba(255,255,255,0.38);
      font-size: 12px; padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.06); border-radius: 999px;
      max-width: 90%;
    }
    :root {
      --bg:      #000000;
      --surface: rgba(255,255,255,0.045);
      --border:  rgba(255,255,255,0.12);
      --accent:  #ffaa30;
      --adim:    rgba(255, 170, 48,0.14);
      --text:    #ffffff;
      --muted:   rgba(255,255,255,0.58);
      --green:   #ffffff;
      --gdim:    rgba(255,255,255,0.12);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── APP LAYOUT ── */
    html, body {
      height: 100%; width: 100%; margin: 0; padding: 0;
      background: #000000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
      gap: 18px;
      padding: 18px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 24px 20px;
      gap: 24px;
      min-height: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
    }
    .logo-pet { width: 30px; height: 30px; vertical-align: middle; margin-right: 10px; }
    .logo em { color: var(--accent); font-style: normal; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 170, 48,0.12);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.18s ease;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .nav-item.active,
    .nav-item:hover {
      background: rgba(255, 170, 48,0.12);
      border-color: rgba(255, 170, 48,0.38);
      color: var(--text);
    }
    .nav-item::after {
      content: '›';
      opacity: 0.6;
      transition: transform 0.18s ease;
    }
    .nav-item.active::after { transform: translateX(2px); }
    .status-card,
    .user-card {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 24px;
      padding: 18px;
    }
    .status-title,
    .section-title {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .status-note,
    .user-role,
    .section-subtitle {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .status-card .pill,
    .top-actions .pill {
      margin-top: 10px;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .user-icon {
      width: 46px;
      height: 46px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.08);
      font-weight: 800;
      color: var(--text);
      font-size: 18px;
    }
    .user-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 18px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 128px;
    }
    .page-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .page-subtitle {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 260px;
      justify-content: flex-end;
    }
    .top-actions .url {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
    }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(360px, 1fr);
      gap: 18px;
      min-height: 0;
    }
    .devices-panel,
    .activity-card,
    .voice-card {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 28px;
      padding: 24px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .section-subtitle {
      font-size: 13px;
      max-width: 420px;
    }
    .devices-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .device-card {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      min-height: 160px;
    }
    .device-card .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .device-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      color: var(--accent);
      font-size: 19px;
    }
    .device-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }
    .device-type {
      font-size: 12px;
      color: var(--muted);
    }
    .device-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .device-status strong {
      color: #a5f3fc;
      font-weight: 700;
    }
    .bar-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ff6a6a, #ff5252);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .bar-fill.level-4 { width: 66%; }
    .bar-fill.level-3 { width: 50%; }
    .bar-fill.level-2 { width: 34%; }
    .bar-fill.level-1 { width: 16%; }
    .device-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .device-toggle {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255, 170, 48,0.12);
      color: var(--accent);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .right-panel {
      display: grid;
      grid-template-rows: minmax(220px, 1fr) minmax(180px, 1fr);
      gap: 18px;
      min-height: 0;
    }
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 360px);
      overflow: auto;
      padding-right: 4px;
    }
    .activity-list::-webkit-scrollbar { width: 6px; }
    .activity-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }
    .activity-item {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 18px;
      padding: 16px;
      display: grid;
      gap: 8px;
    }
    .activity-item.system {
      border-color: rgba(255, 170, 48,0.24);
      background: rgba(255, 170, 48,0.08);
    }
    .activity-item .item-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .activity-item .item-text { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .activity-item .item-meta { font-size: 11px; color: rgba(255,255,255,0.55); display: flex; justify-content: space-between; gap: 10px; }
    .voice-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }
    .voice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .voice-status {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .voice-note {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 14px 16px;
    }
    .voice-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .voice-actions .btn-send {
      padding: 12px 18px;
      min-width: 110px;
    }
    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }
    #inp { flex: 1; min-width: 0; }
    .btn-attach, #mic-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      padding: 0;
    }
    .btn-attach:hover, #mic-btn:hover {
      background: rgba(255, 170, 48, 0.15);
      border-color: rgba(255, 170, 48, 0.4);
      color: #ffaa30;
    }
    #mic-btn.recording {
      background: rgba(255, 70, 70, 0.25);
      border-color: #ff4646;
      color: #ff4646;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.09); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status-pill .dot { width: 8px; height: 8px; }
    .pill.on .dot { background: var(--accent); }
    .voice-card .pill { margin:0; }
    @media (max-width: 1240px) {
      .app-shell { grid-template-columns: 1fr; }
      .content-grid { grid-template-columns: 1fr; }
      .right-panel { grid-template-rows: repeat(2, minmax(180px, auto)); }
    }
    @media (max-width: 720px) {
      .app-shell { padding: 12px; }
      .sidebar { padding: 18px; }
      .topbar, .devices-panel, .activity-card, .voice-card, footer { padding: 18px; }
      .devices-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <iframe id="orb-bg" src="/web_background/index.html" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
  <div id="toast"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><img class="logo-pet" src="/static/pet.png" alt=""><em>Jarvis</em></div>
        <div class="badge">Online</div>
      </div>
      <div class="nav">
        <div class="nav-item active">Dashboard</div>
        <div class="nav-item">Jarvis Home</div>
        <div class="nav-item">Settings</div>
      </div>
      <div class="status-card">
        <div class="status-title">Home Status</div>
        <div class="status-note">Connected devices are ready for voice and remote control.</div>
        <div class="pill on"><span class="dot"></span><span>System Online</span></div>
      </div>
      <div class="user-card">
        <div class="user-icon">J</div>
        <div>
          <div class="user-name">Owner</div>
          <div class="user-role">Local Profile</div>
        </div>
      </div>
    </aside>
    <section class="main-panel">
      <div class="topbar">
        <div>
          <div class="page-title">Jarvis Home</div>
          <div class="page-subtitle">Control your home with Jarvis.</div>
        </div>
        <div class="top-actions">
          <div id="pill" class="pill on"><span class="dot"></span><span id="st">System Online</span></div>
          <div class="url">__IP__:__PORT__</div>
        </div>
      </div>
      <div id="feed"></div>
      <footer>
        <input id="inp" placeholder="Send a command to Jarvis…" autocomplete="off">
        <label class="btn-attach" for="file-inp" title="Send file">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </label>
        <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
        <button id="mic-btn" onclick="doMic()" title="Voice command">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="12" rx="4" ry="4"/>
            <line x1="9.5" y1="5" x2="14.5" y2="5" stroke-width="1.6"/>
            <line x1="9.5" y1="7" x2="14.5" y2="7" stroke-width="1.6"/>
            <line x1="9.5" y1="9" x2="14.5" y2="9" stroke-width="1.6"/>
            <line x1="9.5" y1="11" x2="14.5" y2="11" stroke-width="1.6"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
          </svg>
        </button>
        <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
        <button class="btn btn-send" onclick="doSend()">SEND</button>
      </footer>
    </section>
  </div>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── Local session encryption (CryptoJS) ──────────────────────────────────
    const _AES_SALT = 'Jarvis-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    // Encryption stays enabled silently; no technical badge is shown in the header.

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to Jarvis'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'Jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    const MIC_SVG = '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"2\" width=\"8\" height=\"12\" rx=\"4\" ry=\"4\"/><line x1=\"9.5\" y1=\"5\" x2=\"14.5\" y2=\"5\" stroke-width=\"1.6\"/><line x1=\"9.5\" y1=\"7\" x2=\"14.5\" y2=\"7\" stroke-width=\"1.6\"/><line x1=\"9.5\" y1=\"9\" x2=\"14.5\" y2=\"9\" stroke-width=\"1.6\"/><line x1=\"9.5\" y1=\"11\" x2=\"14.5\" y2=\"11\" stroke-width=\"1.6\"/><path d=\"M5 10a7 7 0 0 0 14 0\"/><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"21\"/><line x1=\"8\" y1=\"21\" x2=\"16\" y2=\"21\"/></svg>';

    function _micIdle() {
      micBtn.innerHTML = MIC_SVG;
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(255, 170, 48,0.08)',
        'border:1px solid rgba(255, 170, 48,0.28)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#ffffff">Enabled</strong> → tap <strong style="color:#ffffff">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
